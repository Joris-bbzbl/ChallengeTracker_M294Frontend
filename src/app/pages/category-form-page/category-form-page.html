<mat-card class="category-form-card">
  <mat-card-header>
    <mat-card-title>{{ isEdit ? 'Edit Category' : 'Create Category' }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSave()" class="category-form">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" placeholder="Enter category name" />
        <mat-error *ngIf="nameControl?.hasError('required')"> Name is required. </mat-error>
      </mat-form-field>

      <div class="actions">
        <button mat-stroked-button type="button" (click)="onCancel()">Cancel</button>
        <button mat-raised-button color="primary" type="submit">Save</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
