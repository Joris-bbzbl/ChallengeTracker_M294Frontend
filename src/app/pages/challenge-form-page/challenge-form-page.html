<mat-card class="challenge-form-card">
  <mat-card-title>{{ isEdit ? 'Edit Challenge' : 'Create Challenge' }}</mat-card-title>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSave()" class="challenge-form">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Title</mat-label>
        <input matInput formControlName="title" placeholder="Enter challenge title" />
        <mat-error *ngIf="titleControl?.hasError('required')"> Title is required. </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Description</mat-label>
        <textarea
          matInput
          rows="4"
          formControlName="description"
          placeholder="Enter a description"
        ></textarea>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Target Value</mat-label>
        <input
          matInput
          type="number"
          formControlName="targetValue"
          min="1"
          placeholder="Enter target value"
        />
        <mat-error *ngIf="targetValueControl?.hasError('required')">
          Target value is required.
        </mat-error>
        <mat-error *ngIf="targetValueControl?.hasError('min')">
          Target value must be greater than 0.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Start Date</mat-label>
        <input matInput type="date" formControlName="startDate" placeholder="Select start date" />
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>End Date</mat-label>
        <input matInput type="date" formControlName="endDate" placeholder="Select end date" />
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Category</mat-label>
        <mat-select formControlName="categoryId">
          <mat-option [value]="null">Select a category</mat-option>
          <mat-option *ngFor="let category of categories" [value]="category.id">
            {{ category.name }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="categoryControl?.hasError('required')"> Category is required. </mat-error>
      </mat-form-field>

      <div class="actions">
        <button mat-stroked-button type="button" (click)="onCancel()">Cancel</button>
        <button mat-raised-button color="primary" type="submit">Save</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
