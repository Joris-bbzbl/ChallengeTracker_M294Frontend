<mat-card *ngIf="challenge">
  <mat-card-header>
    <mat-card-title>{{ challenge.title }}</mat-card-title>
    <mat-card-subtitle>{{ challenge.categoryName }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p>{{ challenge.description }}</p>

    <div class="challenge-stats">
      <div class="stat">
        <span class="label">Status:</span>
        <span class="value">{{ challenge.status }}</span>
      </div>
      <div class="stat">
        <span class="label">Progress:</span>
        <span class="value">{{ challenge.currentValue }} / {{ challenge.targetValue }}</span>
      </div>
    </div>

    <mat-progress-bar mode="determinate" [value]="progressPercentage"></mat-progress-bar>

    <div class="form-section">
      <h3>Add Progress</h3>
      <app-progress-entry-form
        [challengeId]="challenge.id!"
        (progresssubmit)="onProgressEntrySubmit($event)"
      ></app-progress-entry-form>
    </div>

    <div class="list-section">
      <h3>Progress History</h3>
      <app-progress-entry-list [entries]="progressEntries"></app-progress-entry-list>
    </div>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="goBack()">Back</button>
  </mat-card-actions>
</mat-card>
