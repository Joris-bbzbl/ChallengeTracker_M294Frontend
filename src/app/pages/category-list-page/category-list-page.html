<mat-card class="category-list-card">
  <mat-card-header>
    <mat-card-title>Categories</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="toolbar">
      <button mat-raised-button color="primary" (click)="createCategory()">Create Category</button>
    </div>

    <table mat-table [dataSource]="categories" class="mat-elevation-z8 category-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let category">{{ category.name }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let category">
          <button mat-button color="primary" (click)="editCategory(category)">Edit</button>
          <button mat-button color="warn" (click)="deleteCategory(category)">Delete</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <div *ngIf="categories.data.length === 0" class="empty-state">No categories available.</div>
  </mat-card-content>
</mat-card>
