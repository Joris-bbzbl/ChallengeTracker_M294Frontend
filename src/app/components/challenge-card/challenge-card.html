<mat-card class="challenge-card">
  <mat-card-header>
    <mat-card-title>{{ challenge.title }}</mat-card-title>
    <mat-card-subtitle>{{ challenge.categoryName || 'No Category' }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="status-section">
      <span class="status-badge">{{ challenge.status }}</span>
    </div>

    <div class="progress-section">
      <div class="progress-info">
        <span>Progress: {{ challenge.currentValue }} / {{ challenge.targetValue }}</span>
      </div>
      <mat-progress-bar
        mode="determinate"
        [value]="getProgressPercent()"
        class="progress-bar"
      ></mat-progress-bar>
      <div class="percentage">{{ getProgressPercent() | number: '1.0-0' }}%</div>
    </div>
  </mat-card-content>

  <mat-card-actions>
    <button mat-button color="primary" (click)="onView()">View</button>
    <button mat-button color="accent" (click)="onEdit()">Edit</button>
    <button mat-button color="warn" (click)="onDelete()">Delete</button>
  </mat-card-actions>
</mat-card>
