<form (ngSubmit)="onSubmit()" class="progress-form">
  <mat-form-field>
    <mat-label>Value</mat-label>
    <input matInput type="number" [(ngModel)]="value" name="value" required />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Note</mat-label>
    <input matInput [(ngModel)]="note" name="note" />
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit">Add Progress</button>
</form>
